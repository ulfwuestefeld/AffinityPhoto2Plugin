name: Release Package

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Build and Create GitHub Release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Require Logi Plugin Service SDK
        shell: pwsh
        run: |
          $sdkDll = Join-Path $env:ProgramFiles 'Logi\LogiPluginService\PluginApi.dll'
          if (-not (Test-Path -LiteralPath $sdkDll)) {
            throw 'Release packaging requires a Windows runner with the current Logi Plugin Service SDK installed.'
          }

      - name: Install LogiPluginTool
        run: dotnet tool install --global LogiPluginTool --version 6.1.4.22672

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $metadata = Get-Content 'src/AffinityPhoto2Plugin/metadata/LoupedeckPackage.yaml' -Raw
          $match = [regex]::Match($metadata, '(?m)^version:\s*(\S+)')
          if (-not $match.Success) { throw 'Plugin version is missing from package metadata.' }
          "version=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        working-directory: src/AffinityPhoto2Plugin
        run: dotnet restore

      - name: Build Release against installed SDK
        working-directory: src/AffinityPhoto2Plugin
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'AffinityPhoto2Release'
          $outputPath = (Join-Path $outputRoot 'bin') + '\'
          dotnet build -c Release --no-restore "-p:OutputPath=$outputPath" -p:EnablePluginReload=false
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Package, generate SBOM, and verify
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'AffinityPhoto2Release\bin'
          $stage = Join-Path $env:RUNNER_TEMP ("AffinityPhoto2Package-" + [guid]::NewGuid().ToString('N'))
          $package = Join-Path $env:GITHUB_WORKSPACE "AffinityPhoto2_$version.lplug4"
          & .\build\Package-Plugin.ps1 -BuildOutputPath $outputRoot -PackageRoot $stage -PackageOutputPath $package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            AffinityPhoto2_${{ steps.version.outputs.version }}.lplug4
            AffinityPhoto2_${{ steps.version.outputs.version }}.cdx.json
            AffinityPhoto2_${{ steps.version.outputs.version }}.THIRD-PARTY-NOTICES.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            AffinityPhoto2_${{ steps.version.outputs.version }}.lplug4
            AffinityPhoto2_${{ steps.version.outputs.version }}.cdx.json
            AffinityPhoto2_${{ steps.version.outputs.version }}.THIRD-PARTY-NOTICES.md
          retention-days: 90
