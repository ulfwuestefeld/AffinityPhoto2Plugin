name: Build Affinity Photo 2 Plugin

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'build/**'
      - 'FOSS-LICENSES.json'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - 'FOSS-LICENSES.json'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/**'

jobs:
  build:
    name: Build Plugin
    runs-on: windows-latest
    outputs:
      sdk_found: ${{ steps.check-sdk.outputs.sdk_found }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check for Logi Plugin Service SDK
        id: check-sdk
        shell: pwsh
        run: |
          $sdkDll = Join-Path $env:ProgramFiles 'Logi\LogiPluginService\PluginApi.dll'
          if (Test-Path -LiteralPath $sdkDll) {
            "sdk_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Logi Plugin Service SDK found: $sdkDll"
          } else {
            "sdk_found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Logi Plugin Service SDK is not installed; SDK-dependent build and packaging are skipped."
          }

      - name: Restore
        if: steps.check-sdk.outputs.sdk_found == 'true'
        working-directory: src/AffinityPhoto2Plugin
        run: dotnet restore

      - name: Build Debug and Release
        if: steps.check-sdk.outputs.sdk_found == 'true'
        working-directory: src/AffinityPhoto2Plugin
        shell: pwsh
        run: |
          foreach ($configuration in @('Debug', 'Release')) {
            $outputRoot = Join-Path $env:RUNNER_TEMP "AffinityPhoto2Build\$configuration"
            $outputPath = (Join-Path $outputRoot 'bin') + '\'
            dotnet build -c $configuration --no-restore "-p:OutputPath=$outputPath" -p:EnablePluginReload=false
            if ($LASTEXITCODE -ne 0) {
              throw "$configuration build failed."
            }
          }

      - name: Upload Debug build
        if: steps.check-sdk.outputs.sdk_found == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: debug-build
          path: ${{ runner.temp }}/AffinityPhoto2Build/Debug/
          retention-days: 5

      - name: Upload Release build
        if: steps.check-sdk.outputs.sdk_found == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-build
          path: ${{ runner.temp }}/AffinityPhoto2Build/Release/
          retention-days: 30

  package:
    name: Package Plugin with SBOM
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.sdk_found == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Download Release build
        uses: actions/download-artifact@v7.0.1
        with:
          name: release-build
          path: artifacts/Release/

      - name: Install LogiPluginTool
        run: dotnet tool install --global LogiPluginTool --version 6.1.4.22672

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $metadata = Get-Content 'src/AffinityPhoto2Plugin/metadata/LoupedeckPackage.yaml' -Raw
          $match = [regex]::Match($metadata, '(?m)^version:\s*(\S+)')
          if (-not $match.Success) { throw 'Plugin version is missing from package metadata.' }
          "version=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create and verify package, FOSS notices, and SBOM
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $stage = Join-Path $env:RUNNER_TEMP ("AffinityPhoto2Package-" + [guid]::NewGuid().ToString('N'))
          $package = Join-Path $env:GITHUB_WORKSPACE "AffinityPhoto2_$version.lplug4"
          & .\build\Package-Plugin.ps1 -BuildOutputPath 'artifacts/Release/bin' -PackageRoot $stage -PackageOutputPath $package

      - name: Upload package and SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: plugin-package
          path: |
            AffinityPhoto2_${{ steps.version.outputs.version }}.lplug4
            AffinityPhoto2_${{ steps.version.outputs.version }}.cdx.json
            AffinityPhoto2_${{ steps.version.outputs.version }}.THIRD-PARTY-NOTICES.md
          retention-days: 90
