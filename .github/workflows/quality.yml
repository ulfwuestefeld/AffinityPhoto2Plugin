name: Code Quality and Package Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'build/**'
      - 'FOSS-LICENSES.json'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - 'FOSS-LICENSES.json'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/**'

jobs:
  validate:
    name: Validate Sources and Package
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Validate FOSS inventory
        shell: pwsh
        run: |
          $inventory = Get-Content 'FOSS-LICENSES.json' -Raw | ConvertFrom-Json
          $names = @($inventory.components | ForEach-Object { $_.fileName })
          if ($names.Count -ne @($names | Select-Object -Unique).Count) {
            throw 'FOSS-LICENSES.json contains duplicate component filenames.'
          }
          foreach ($component in $inventory.components) {
            if ($component.license -and $component.license -notin @('MIT', 'MS-PL')) {
              throw "Unreviewed SPDX license '$($component.license)' for $($component.fileName)."
            }
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check for Logi Plugin Service SDK
        id: check-sdk
        shell: pwsh
        run: |
          $sdkDll = Join-Path $env:ProgramFiles 'Logi\LogiPluginService\PluginApi.dll'
          $found = Test-Path -LiteralPath $sdkDll
          "sdk_found=$($found.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if (-not $found) {
            Write-Host 'SDK-dependent build/package checks are skipped because the hosted runner has no Logi Plugin Service SDK.'
          }

      - name: Restore
        if: steps.check-sdk.outputs.sdk_found == 'true'
        working-directory: src/AffinityPhoto2Plugin
        run: dotnet restore

      - name: Build
        if: steps.check-sdk.outputs.sdk_found == 'true'
        working-directory: src/AffinityPhoto2Plugin
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'AffinityPhoto2Quality'
          $outputPath = (Join-Path $outputRoot 'bin') + '\'
          dotnet build -c Release --no-restore "-p:OutputPath=$outputPath" -p:EnablePluginReload=false
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Install LogiPluginTool
        if: steps.check-sdk.outputs.sdk_found == 'true'
        run: dotnet tool install --global LogiPluginTool --version 6.1.4.22672

      - name: Verify package and generated SBOM
        if: steps.check-sdk.outputs.sdk_found == 'true'
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP 'AffinityPhoto2Quality\bin'
          $stage = Join-Path $env:RUNNER_TEMP ("AffinityPhoto2QualityPackage-" + [guid]::NewGuid().ToString('N'))
          $package = Join-Path $env:RUNNER_TEMP ("AffinityPhoto2Quality-" + [guid]::NewGuid().ToString('N') + '.lplug4')
          & .\build\Package-Plugin.ps1 -BuildOutputPath $outputPath -PackageRoot $stage -PackageOutputPath $package
